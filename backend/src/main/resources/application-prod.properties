server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.election.total-eligible-voters=${APP_ELECTION_TOTAL_ELIGIBLE_VOTERS:160}
app.election.voter-hash-pepper=${APP_ELECTION_VOTER_HASH_PEPPER}
app.election.enforce-one-vote=${APP_ELECTION_ENFORCE_ONE_VOTE:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.mail.mode=brevo
app.mail.brevo-api-key=${BREVO_API_KEY}
app.mail.from-address=${MAIL_FROM_ADDRESS}
app.mail.from-name=MSA Elections
