server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.election.total-eligible-voters=${APP_ELECTION_TOTAL_ELIGIBLE_VOTERS:160}
app.election.voter-hash-pepper=${APP_ELECTION_VOTER_HASH_PEPPER}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.mail.mode=smtp
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from-address=${MAIL_USERNAME}
app.mail.from-name=MSA Elections
