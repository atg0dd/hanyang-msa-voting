name: Keep backend alive

# Two independent things go cold on their own schedule: Render's free
# app instance sleeps after ~15 minutes idle, and Neon's free Postgres
# compute separately suspends after just 5 minutes idle (Neon docs:
# resume from that is normally sub-second, so if a request is taking
# many seconds even on a warm app, Neon's DB is what went back to
# sleep between pings). Pinging a DB-backed endpoint every 5 minutes -
# GitHub Actions' documented minimum cron granularity, and right at
# Neon's 5-minute window - keeps both warm with one ping. Free: this
# repo is public, so GitHub Actions minutes aren't metered here.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: |
          # curl itself (timeout, DNS, connection refused) must not fail this
          # step - GitHub Actions runs bash with `set -e`, so a cold backend
          # that's briefly unreachable would otherwise kill the job before
          # the status-code check below even runs.
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://hanyang-msa-voting.onrender.com/api/teams || echo "000")
          echo "Backend responded with status $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::warning::Backend returned non-2xx status ($status)"
          fi
